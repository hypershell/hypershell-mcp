[project]
name = "hypershell-mcp"
version = "0.1.0"
description = "HyperShell MCP Server: Enables Agentic-development with HyperShell"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hypershell>=2.7.0",
    "fastmcp>=2.0.0,<3",
]

[project.optional-dependencies]
postgres = ["psycopg2>=2.9.9"]
uuid7 = ["uuid-utils>=0.10.0"]

[project.scripts]
hypershell-mcp = "hypershell_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hypershell_mcp"]

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
markers = [
    "unit",
    "integration",
]

[dependency-groups]
dev = [
    "psycopg2>=2.9.9",
    "uuid-utils>=0.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.0.0",
]

[tool.uv.sources]
hypershell = { path = "../hypershell", editable = true }
