[project]
name = "hypershell-mcp"
version = "0.2.0"
description = "MCP server for HyperShell: many-task computing for agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Geoffrey Lentner" }]
dependencies = [
    "hypershell>=2.9.0a6",
    "fastmcp>=4.1.8,<4.2",
    "regex>=2024.11.6",
]

[project.scripts]
hypershell-mcp = "hypershell_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hypershell_mcp"]

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["unit", "integration"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
